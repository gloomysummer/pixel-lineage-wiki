    [GREY FEATURE] 反嵌套探针伪装（SOP 六.2 · 矩阵标准玩法）
    作用：让 invoke.js 的 iframe 自检（window.top === window.self）恒为真，
          按"顶层原生页"全价出价，而不是 iframe 降级价。
    它不伪造展示/点击/统计数字，只改广告脚本对自身环境的判断 —— 条款灰区。

    ▶ 秒级撤回：用 git 实现 Feature Flag
        git checkout HEAD~1 -- public/ads/banner-160x600.html && git commit -m "revert anti-frame bypass" && git push
      （或直接删掉下面 <script> 块即为纯净直出版本）
    ═══════════════════════════════════════════════════════════════════
  -->
  <script>
    try {
      Object.defineProperty(window, 'top', { get: function() { return window.self; } });
      Object.defineProperty(window, 'parent', { get: function() { return window.self; } });
      Object.defineProperty(window, 'frameElement', { get: function() { return null; } });
    } catch (e) {}
  </script>
